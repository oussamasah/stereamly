name: Build staging images
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE }}
          aws-region: eu-west-3
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: streamly-${{ matrix.app }}
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_PUBLIC_API_URL }}
          NEXT_PUBLIC_TMDB_API_KEY: ${{ vars.STAGING_TMDB_API_KEY }}
        run: docker build --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" --build-arg NEXT_PUBLIC_TMDB_API_KEY="$NEXT_PUBLIC_TMDB_API_KEY" -f apps/${{ matrix.app }}/Dockerfile -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" . && docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
      - name: Record immutable image for deployment
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP: ${{ matrix.app }}
          IMAGE_TAG: ${{ github.sha }}
        run: echo "$REGISTRY/streamly-$APP:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
